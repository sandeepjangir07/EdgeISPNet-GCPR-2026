name: EdgeISPNet_phase2
experiments_root: ./experiments
phase: train
gpu_ids: [0]
seed: 10

resume:
  path: ./experiments/EdgeISPNet_phase1/best/edgeispnet_step500000.pth
  load_optimizer: false

datasets:
  scale: 2
  rgb_crop_size: 512
  output_bit_depth: 8
  tile_size: 512
  border_padding: 50
  border_padding_type: reflect

  train:
    dataroot_RAW: /path/to/dataset/train/raw
    dataroot_RGB: /path/to/dataset/train/rgb
    preprocessed_dir: null
    crops_per_image: 64
    batch_size: 40
    num_workers: 4

  val:
    dataroot_RAW: /path/to/dataset/val/raw
    dataroot_RGB: /path/to/dataset/val/rgb
    preprocessed_dir: null
    crops_per_image: 8
    batch_size: 8
    num_workers: 2

  test:
    dataroot_RAW: /path/to/dataset/test/raw
    preprocessed_dir: null
    cache_images: true
    batch_size: 1
    num_workers: 1

network:
  in_channel: 4
  out_channel: 3
  inter_channel: 8
  block_nums: 4
  blocks_per_group: 3
  act_type: gelu
  with_idt: true
  use_gsrm: true

train:
  n_iter: 400000
  lr: !!float 1e-4
  lr_steps: [200000, 300000, 350000]
  lr_gamma: 0.5
  print_freq: 200
  val_freq: 10000
  save_freq: 5000
  val_save_images: 8

  loss_weights:
    charbonnier: 0.8
    ms_ssim: 0.75
    perceptual: 1.0
    adversarial: 0.5

  gan:
    enabled: true
    type: lsgan
    lr: !!float 1e-4
    num_feat: 32
